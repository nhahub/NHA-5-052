# E-Commerce Data Integration & Analytics Pipeline - local stack
#   Airflow (LocalExecutor) + MySQL (our store) + MongoDB (site offers) + PostgreSQL (warehouse)
#   Passwords come from .env (copy .env.example to .env); the defaults below are for local use only.
#
# Start:  docker compose up -d        Airflow UI: http://localhost:8081  (admin / admin)
# DBeaver: MySQL localhost:3306 | PostgreSQL warehouse localhost:5433 | MongoDB localhost:27017

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.9.2}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pandas mysql-connector-python psycopg2-binary pymongo requests beautifulsoup4}
    # connection settings read by the ETL and scraper scripts
    OLTP_HOST: mysql
    OLTP_PORT: "3306"
    OLTP_USER: ${MYSQL_USER:-oltp_user}
    OLTP_PASSWORD: ${MYSQL_PASSWORD:-oltp_password}
    OLTP_DB: ecommerce_oltp
    DW_HOST: postgres-dw
    DW_PORT: "5432"
    DW_USER: ${DW_USER:-dw_user}
    DW_PASSWORD: ${DW_PASSWORD:-dw_password}
    DW_DB: ecommerce_dw
    MONGO_HOST: mongodb
    MONGO_PORT: "27017"
    MONGO_USER: ${MONGO_USER:-mongo_admin}
    MONGO_PASSWORD: ${MONGO_PASSWORD:-mongo_password}
    MONGO_DB: catalog
    SCRAPER_CONTACT: ${SCRAPER_CONTACT:-team-email@example.com}
  volumes:
    - ./05_etl/dags:/opt/airflow/dags
    - ./05_etl/scripts:/opt/airflow/scripts
    - ./01_oltp/scripts:/opt/airflow/oltp
    - ./02_nosql/scripts:/opt/airflow/nosql
    - ./05_etl/config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- project databases
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ecommerce_oltp
      MYSQL_USER: ${MYSQL_USER:-oltp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oltp_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: always

  postgres-dw:
    image: postgres:16
    container_name: ecommerce-postgres-dw
    environment:
      POSTGRES_USER: ${DW_USER:-dw_user}
      POSTGRES_PASSWORD: ${DW_PASSWORD:-dw_password}
      POSTGRES_DB: ecommerce_dw
    ports:
      - "5433:5432"
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DW_USER:-dw_user}", "-d", "ecommerce_dw"]
      interval: 10s
      retries: 10
    restart: always

  # ---------------------------------------------------------------- Airflow
  postgres:                      # Airflow metadata database (not the warehouse)
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
      mongodb:
        condition: service_started

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,data}
        /entrypoint airflow version
        airflow db migrate
        airflow users create \
          --username admin --firstname admin --lastname admin \
          --role Admin --email admin@example.com --password admin || true
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,plugins,data}
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

volumes:
  postgres-db-volume:
  mysql-data:
  mongodb-data:
  postgres-dw-data:
